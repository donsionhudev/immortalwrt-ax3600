name: Build ImmortalWrt AX3600 (Expand Layout)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload firmware to GitHub Releases?'
        required: true
        default: 'true'
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ax3600.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -a -f || true
        sudo -E apt-get -y purge azure-cli* docker* ghc* zulu* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* moby* snap* || true
        sudo -E apt-get -qq update
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        df -h

    - name: Initialization Environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lld llvm lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
          python3-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
          unzip vim wget xmlto xxd zlib1g-dev zstd

    - name: Clone Source Code
      run: |
        df -h
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "OPENWRTPATH=$PWD" >> $GITHUB_ENV

    - name: Load Custom Feeds (diy-part1.sh)
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        echo "=== Current feeds.conf.default ==="
        cat feeds.conf.default
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "=== Verifying Python Version in Feeds (Must be 3.11 for 24.10) ==="
        cat feeds/packages/lang/python/python3-version.mk
        grep "PYTHON3_VERSION_MINOR:=11" feeds/packages/lang/python/python3-version.mk || {
          echo "ERROR: Incorrect Python branch detected! Aborting to prevent failed build."
          exit 1
        }

    - name: Load Custom Configuration
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    - name: Download Package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the Firmware
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "COMPILE_STATUS=success" >> $GITHUB_ENV

    - name: Check Space Usage
      if: (!cancelled())
      run: df -h

    - name: Organize Firmware Files
      if: env.COMPILE_STATUS == 'success'
      run: |
        cd openwrt/bin/targets/qualcommax/ipq807x
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "RELEASE_TAG=AX3600-ImmortalWrt-$(date +"%Y%m%d-%H%M")" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV

    - name: Upload Firmware Directory to Artifacts
      uses: actions/upload-artifact@v4
      if: env.COMPILE_STATUS == 'success'
      with:
        name: ImmortalWrt-AX3600-Firmware
        path: ${{ env.FIRMWARE_PATH }}
        retention-days: 14

    - name: Publish Firmware to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: (github.event.inputs.release == 'true' || env.UPLOAD_RELEASE == 'true') && env.COMPILE_STATUS == 'success'
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "小米 AX3600 ImmortalWrt 24.10 大分区满血固件 (${{ env.BUILD_DATE }})"
        body: |
          ### 小米 AIoT 路由器 AX3600 专属定制固件

          * **基底版本**：ImmortalWrt 24.10 (Linux 6.6 LTS 稳定内核)
          * **分区架构**：**OpenWrt expand layout (240MB 大分区)**
          * **硬件加速**：Qualcomm NSS 硬件转发加速 (千兆跑满 CPU 0% 占用)
          * **默认管理 IP**：`192.168.3.1`
          * **默认登录账号**：`root`
          * **默认登录密码**：无（留空直接回车）
          * **默认 Wi-Fi**：已开启，SSID: `AX3600` / `AX3600_5G`，密码：`12345678`
          * **管理主题**：Argon
          * **核心组件**：
            * `HomeProxy`（官方原生 sing-box 客户端，已集成 sing-box 核心）
            * `FRP 内网穿透`（客户端 frpc + 服务端 frps，含 LuCI 设置界面与完整中文）
            * `dnsmasq-full`（集成 nftset, ipset, dnssec）
            * `UPnP`（自动端口映射）
            * `ttyd`（网页终端命令行）

          > ⚠️ **刷机提示**：
          > * 首次从不死 U-Boot 网页（`192.168.1.1`）刷入，请选择 **`*xiaomi_ax3600-squashfs-factory.ubi`**！
          > * 之后在 OpenWrt 后台系统内升级，请选择 **`*xiaomi_ax3600-squashfs-sysupgrade.bin`**！
        files: |
          ${{ env.FIRMWARE_PATH }}/*xiaomi_ax3600-squashfs-factory.ubi
          ${{ env.FIRMWARE_PATH }}/*xiaomi_ax3600-squashfs-sysupgrade.bin
          ${{ env.FIRMWARE_PATH }}/sha256sums
